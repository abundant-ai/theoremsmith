[project]
name = "theoremsmith"
version = "0.1.0"
description = "Turns a Lean 4 repository into a graded proof-writing task."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
theoremsmith = "theoremsmith.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/theoremsmith"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["server"]
